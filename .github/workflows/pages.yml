# Shared footer renderer: 29fe4f433de35df85e3ca67ab42204d1dd41dc9c
name: Deploy app introduction
on:
  schedule:
    - cron: '42 6 * * *'
  push:
    branches: [main]
    paths: ['.github/brand/**', 'public/**', 'client/public/**', 'site/**', 'docs/readme/banner.png', 'README.md', 'README.zh-CN.md', 'docs/readme/assets/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build introduction only
        run: python3 site/build.py
      - uses: actions/configure-pages@v5
      - name: Apply and verify shared series footer
        uses: SonghaiFan/SonghaiFan/.github/actions/series-footer@main
        with:
          series: frankie
          site-root: _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@f33f41b675f0ab2dc5a6863c9a170fe83af3571e # v4.0.0: REST artifact lookup
