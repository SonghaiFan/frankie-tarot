<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 46 274 374" width="274" height="374">
  <title>Aura card logo</title>
  <defs>
    <clipPath id="face">
      <rect x="40" y="70" width="250" height="350"/>
    </clipPath>

    <!-- every layer is a plain radial gradient fading to transparent: no filters, no images -->
    <radialGradient id="halo" gradientUnits="userSpaceOnUse" cx="230" cy="225" r="150">
      <stop offset="0"    stop-color="#efe4c6" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#f3d9b4" stop-opacity="0.85"/>
      <stop offset="1"    stop-color="#ffae78" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sky" gradientUnits="userSpaceOnUse" cx="70" cy="60" r="250">
      <stop offset="0"    stop-color="#1a63d4" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#1a63d4" stop-opacity="1"/>
      <stop offset="0.78" stop-color="#4f78d6" stop-opacity="0.55"/>
      <stop offset="1"    stop-color="#b8b2d6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rim" gradientUnits="userSpaceOnUse" cx="285" cy="440" r="165">
      <stop offset="0"   stop-color="#ffa03a" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#ff8a30" stop-opacity="0.6"/>
      <stop offset="1"   stop-color="#ff8a30" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="pool" gradientUnits="userSpaceOnUse" cx="290" cy="445" r="125">
      <stop offset="0"    stop-color="#0e9b8c" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#22a862" stop-opacity="1"/>
      <stop offset="1"    stop-color="#22a862" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rose" gradientUnits="userSpaceOnUse" cx="30" cy="430" r="130">
      <stop offset="0" stop-color="#ef5577" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ef5577" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- black box behind, extruded up and to the right -->
  <polygon points="40,70 64,46 314,46 314,396 290,420 40,420" fill="#1c1b1a"/>

  <!-- the aura -->
  <g clip-path="url(#face)">
    <rect x="40" y="70" width="250" height="350" fill="#ff6424"/>
    <rect x="40" y="70" width="250" height="350" fill="url(#rose)"/>
    <rect x="40" y="70" width="250" height="350" fill="url(#rim)"/>
    <rect x="40" y="70" width="250" height="350" fill="url(#pool)"/>
    <rect x="40" y="70" width="250" height="350" fill="url(#halo)"/>
    <rect x="40" y="70" width="250" height="350" fill="url(#sky)"/>
  </g>

  <!-- frame -->
  <rect x="44" y="74" width="242" height="342" fill="none" stroke="#1c1b1a" stroke-width="8"/>

  <!-- sparkle -->
  <path transform="translate(72 104) scale(0.52)" fill="#ffffff"
        d="M50 0 C54 34 66 46 100 50 C66 54 54 66 50 100 C46 66 34 54 0 50 C34 46 46 34 50 0Z"/>
</svg>
